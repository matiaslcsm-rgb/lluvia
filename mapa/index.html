<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de San Miguel</title>
  <style>
    :root { --bg: #101216; --panel: rgba(16, 18, 22, 0.92); --line: #2c313a; --text: #e8e8ee; --dim: #9a9db0; --accent: #ffd23f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    canvas.drag { cursor: grabbing; }
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    #controls { top: 12px; left: 12px; width: 250px; }
    #controls h1 { font-size: 16px; margin: 0 0 4px; color: var(--accent); }
    #controls p { margin: 0 0 10px; color: var(--dim); font-size: 12px; }
    #controls label { display: flex; gap: 8px; align-items: center; margin: 4px 0; cursor: pointer; }
    #controls .row { margin-top: 10px; }
    #controls select, #controls input[type=range] { width: 100%; }
    #level { font-weight: 700; color: var(--accent); }
    #info { bottom: 12px; left: 12px; width: 300px; display: none; }
    #info h2 { font-size: 15px; margin: 0 0 6px; }
    #info dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 13px; }
    #info dt { color: var(--dim); }
    #legend { top: 12px; right: 12px; width: 190px; font-size: 12px; }
    #legend div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    #legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
    #status { bottom: 12px; right: 12px; font-size: 12px; color: var(--dim); }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div id="controls" class="panel">
    <h1>Mapa de San Miguel</h1>
    <p>Arrastrá para moverte, rueda para acercar, clic en un edificio para ver qué es.</p>
    <label><input type="checkbox" id="lTerrain" checked> Relieve del terreno</label>
    <label><input type="checkbox" id="lBuildings" checked> Edificios</label>
    <label><input type="checkbox" id="lPlaces"> Nombres de lugares</label>
    <div class="row">Color de los edificios
      <select id="colorBy"><option value="real" selected>aspecto real</option><option value="kind">por tipo</option><option value="floors">por pisos</option><option value="roof">por techo</option><option value="src">por fuente del dato</option></select>
    </div>
    <div class="row">Nivel: <span id="level">planta baja</span>
      <input type="range" id="levelRange" min="-1" max="8" value="0">
    </div>
  </div>
  <div id="legend" class="panel"></div>
  <div id="info" class="panel"></div>
  <div id="status" class="panel"></div>
  <script src="../data/map-sanmiguel.js"></script>
  <script src="../js/util.js"></script>
  <script src="../js/city.js"></script>
  <script src="../js/view/mapdraw.js"></script>
  <script src="mapa.js"></script>
</body>
</html>
